name = "accoutingsuppor02"
main = "src/entry-mobile-ux.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "node apply-v740-team-auto-onboarding.mjs && node apply-v751-production-google-auth.mjs && node apply-v7511-google-status-route-fix.mjs && node apply-v756-admin-ops-route.mjs && node apply-v757-admin-pin-session.mjs && node apply-v761-readonly-connection-status.mjs && node apply-v768-workflow-line-notify-role-fix.mjs && node apply-v769-auto-cash-position.mjs && node apply-v7692-cash-balance-stability.mjs && node apply-v770-multi-image-no-silent-loss.mjs && node apply-v7701-review-state-rescue.mjs"

[vars]
DEFAULT_SHEET_ID = ""
SHEET_TAB = "รายจ่าย"
DRIVE_FOLDER_ID = ""
CLAUDE_MODEL = "claude-sonnet-4-5"
DASHBOARD_URL = "https://deal-dashboard.organization-23c.workers.dev"
WORKER_URL = "https://accoutingsuppor02.organization-23c.workers.dev"
GMAIL_INITIAL_LOOKBACK_DAYS = "45"
GMAIL_SYNC_BATCH = "5"
GMAIL_CRON_MAX_MESSAGES = "3"
BETA_TRIAL_DAYS = "60"
SUBSCRIPTION_ENFORCEMENT = "1"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "19ef27ff24a044acb0bf6856ae733636"

[[durable_objects.bindings]]
name = "MULTI_SESSIONS"
class_name = "MultiExpenseSession"

[[migrations]]
tag = "multi_documents_v1"
new_sqlite_classes = ["MultiExpenseSession"]
